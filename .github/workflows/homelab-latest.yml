name: homelab latest
# This repository always runs the latest homelab. Hourly, move fleet.revision
# to homelab's head and @crvouga/homelab to that same commit (a git dependency
# until the package is on npm, then the npm `latest` tag;
# scripts/dev/fleet-latest.sh) and open a self-merging PR, so the pins never
# lag by more than an hour plus CI. homelab changes several times a day, so
# Dependabot's weekly run is too slow and ignores this package.
on:
  schedule:
    - cron: '7 * * * *'
  repository_dispatch:
    types: [homelab-released]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: homelab-latest
  cancel-in-progress: false
jobs:
  bump:
    name: Pin the latest homelab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: agent/homelab-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Pushes and PRs made with GITHUB_TOKEN start no workflows, so the
          # PR would never get required checks. Use the PAT.
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      - uses: ./.github/actions/setup
      - name: Move the pins to the latest homelab
        run: sh scripts/dev/fleet-latest.sh
      - name: Open a self-merging PR
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          files='fleet.revision packages/workstation/package.json bun.lock'
          # shellcheck disable=SC2086
          if [ -z "$(git status --porcelain -- $files)" ]; then
            echo 'homelab pins are current.'
            exit 0
          fi
          version=$(sed -n 's|.*"@crvouga/homelab": *"\([^"]*\)".*|\1|p' packages/workstation/package.json)
          revision=$(cut -c1-12 fleet.revision)
          title="chore(deps): pin the latest homelab ($version, $revision)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          # shellcheck disable=SC2086
          git add -- $files
          git commit -m "$title"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" --label deps --title "$title" \
              --body 'Automated: moves `fleet.revision` to the head of homelab and `@crvouga/homelab` to that same commit, or to the npm `latest` tag once the package is published (`scripts/dev/fleet-latest.sh`). Opened by the homelab latest workflow; merges itself when Check passes.'
          else
            gh pr edit "$BRANCH" --title "$title"
          fi
          gh pr merge "$BRANCH" --auto --squash
